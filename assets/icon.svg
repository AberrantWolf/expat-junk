<?xml version="1.0" encoding="UTF-8"?>
<!-- Placeholder app icon for expat-junk: two overlapping speech bubbles
     (translation / conversation). Font-free (pure shapes) so it renders
     identically everywhere. Replace with real artwork when available. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23315c"/>
      <stop offset="1" stop-color="#141d38"/>
    </linearGradient>
  </defs>

  <!-- rounded-square background -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" fill="url(#bg)"/>

  <!-- back bubble (source language, amber) -->
  <g>
    <rect x="150" y="220" width="500" height="360" rx="84" ry="84" fill="#f4a429"/>
    <path d="M 250 560 L 250 690 L 360 560 Z" fill="#f4a429"/>
    <circle cx="300" cy="400" r="34" fill="#23315c"/>
    <circle cx="400" cy="400" r="34" fill="#23315c"/>
    <circle cx="500" cy="400" r="34" fill="#23315c"/>
  </g>

  <!-- front bubble (target language, teal) -->
  <g>
    <rect x="374" y="444" width="500" height="360" rx="84" ry="84" fill="#1fc8a0"/>
    <path d="M 774 784 L 774 914 L 664 784 Z" fill="#1fc8a0"/>
    <circle cx="524" cy="624" r="34" fill="#0e3b33"/>
    <circle cx="624" cy="624" r="34" fill="#0e3b33"/>
    <circle cx="724" cy="624" r="34" fill="#0e3b33"/>
  </g>
</svg>
