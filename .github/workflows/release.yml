name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.display_name }})
    runs-on: ${{ matrix.runner }}
    env:
      HAS_MACOS_SIGNING: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            display_name: linux-x64
          - target: x86_64-apple-darwin
            runner: macos-latest
            display_name: macos-x64
          - target: aarch64-apple-darwin
            runner: macos-latest
            display_name: macos-arm64
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            display_name: windows-x64
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - name: Set package versions
        shell: bash
        run: |
          PACKAGE_VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            PACKAGE_VERSION="${GITHUB_REF_NAME#v}"
            ARTIFACT_VERSION="$GITHUB_REF_NAME"
          else
            ARTIFACT_VERSION="v${PACKAGE_VERSION}-test-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          fi
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"
          echo "ARTIFACT_VERSION=$ARTIFACT_VERSION" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libgl1-mesa-dev libgtk-3-dev libatk1.0-dev

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ matrix.target }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-cargo-registry-

      # GUI-only, single binary `expat-junk`. The `ocr` feature stays off (it links
      # system Tesseract/Leptonica at build time); PDF rendering is pure Rust
      # (junk-libs-platen), so the default release build needs no extra native deps.
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      # --- macOS code signing setup (skipped if signing secrets are absent) ---

      - name: Import Developer ID certificate
        if: runner.os == 'macOS' && env.HAS_MACOS_SIGNING == 'true'
        env:
          CERT_B64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PW: ${{ secrets.MACOS_CERT_PASSWORD }}
          KC_PW: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          echo "$CERT_B64" | base64 --decode -o cert.p12
          security create-keychain -p "$KC_PW" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KC_PW" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_PW" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KC_PW" build.keychain
          rm cert.p12
          IDENTITY=$(security find-identity -v -p codesigning build.keychain \
            | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application identity found in keychain"
            exit 1
          fi
          echo "MACOS_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "Found signing identity: $IDENTITY"

      # --- macOS .app bundle ---

      - name: Build GUI .app bundle (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP="Expat Junk.app"

          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources"

          # The render engine is pure Rust (junk-libs-platen) — the binary is
          # self-contained, nothing to bundle into Frameworks.
          cp "target/${{ matrix.target }}/release/expat-junk" "$APP/Contents/MacOS/"
          cp "assets/icon.icns" "$APP/Contents/Resources/AppIcon.icns"
          mkdir -p "$APP/Contents/Resources/Licenses"
          cp THIRD-PARTY.md assets/fonts/*OFL.txt "$APP/Contents/Resources/Licenses/"

          # Substitute version into Info.plist
          sed "s/\${VERSION}/${PACKAGE_VERSION}/g" assets/Info.plist > "$APP/Contents/Info.plist"

          echo "GUI_APP=${APP}" >> "$GITHUB_ENV"
          echo "GUI_ARCHIVE=Expat-Junk-${ARTIFACT_VERSION}-${{ matrix.display_name }}.zip" >> "$GITHUB_ENV"

      - name: Sign GUI .app bundle (macOS)
        if: runner.os == 'macOS' && env.HAS_MACOS_SIGNING == 'true'
        shell: bash
        run: |
          ENTITLEMENTS="assets/entitlements.plist"

          # Sign the binary, then the bundle (no bundled libraries to sign).
          codesign --force --options runtime --timestamp \
            --entitlements "$ENTITLEMENTS" \
            --sign "$MACOS_SIGN_IDENTITY" \
            "$GUI_APP/Contents/MacOS/expat-junk"
          codesign --force --options runtime --timestamp \
            --entitlements "$ENTITLEMENTS" \
            --sign "$MACOS_SIGN_IDENTITY" \
            "$GUI_APP"

          codesign --verify --deep --strict --verbose=2 "$GUI_APP"

      - name: Zip GUI .app bundle (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ditto -c -k --sequesterRsrc --keepParent "$GUI_APP" "$GUI_ARCHIVE"

      - name: Notarize and staple (macOS)
        if: runner.os == 'macOS' && env.HAS_MACOS_SIGNING == 'true'
        env:
          APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_PW: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        shell: bash
        run: |
          xcrun notarytool submit "$GUI_ARCHIVE" \
            --apple-id "$APPLE_ID" \
            --password "$NOTARY_PW" \
            --team-id "$TEAM_ID" \
            --wait
          xcrun stapler staple "$GUI_APP"
          xcrun stapler validate "$GUI_APP"

          # Re-zip so the downloaded archive carries the stapled ticket.
          rm "$GUI_ARCHIVE"
          ditto -c -k --sequesterRsrc --keepParent "$GUI_APP" "$GUI_ARCHIVE"

      # --- Linux AppImage ---

      - name: Package GUI (Linux AppImage)
        if: runner.os == 'Linux'
        shell: bash
        env:
          APPIMAGETOOL_VERSION: "1.9.1"
          APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
          APPIMAGE_RUNTIME_VERSION: "20251108"
          APPIMAGE_RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
        run: |
          APPDIR="Expat-Junk.AppDir"

          mkdir -p "$APPDIR/usr/bin"

          # The render engine is pure Rust (junk-libs-platen) — the binary is
          # self-contained, no usr/lib payload or rpath fixes needed.
          cp "target/${{ matrix.target }}/release/expat-junk" "$APPDIR/usr/bin/"
          cp "assets/expat-junk.desktop" "$APPDIR/"
          cp "assets/icon-256.png" "$APPDIR/expat-junk.png"
          mkdir -p "$APPDIR/usr/share/licenses/expat-junk"
          cp THIRD-PARTY.md assets/fonts/*OFL.txt "$APPDIR/usr/share/licenses/expat-junk/"

          # Create AppRun symlink
          ln -s usr/bin/expat-junk "$APPDIR/AppRun"

          # Pin and verify both tools: appimagetool otherwise fetches a moving runtime.
          curl --fail --location --retry 3 --output appimagetool-x86_64.AppImage \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage"
          curl --fail --location --retry 3 --output runtime-x86_64 \
            "https://github.com/AppImage/type2-runtime/releases/download/${APPIMAGE_RUNTIME_VERSION}/runtime-x86_64"
          echo "${APPIMAGETOOL_SHA256}  appimagetool-x86_64.AppImage" | sha256sum --check --strict
          echo "${APPIMAGE_RUNTIME_SHA256}  runtime-x86_64" | sha256sum --check --strict
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 VERSION="$PACKAGE_VERSION" ./appimagetool-x86_64.AppImage \
            --appimage-extract-and-run --runtime-file runtime-x86_64 "$APPDIR" \
            "Expat-Junk-${ARTIFACT_VERSION}-linux-x64.AppImage"

          echo "GUI_ARCHIVE=Expat-Junk-${ARTIFACT_VERSION}-linux-x64.AppImage" >> "$GITHUB_ENV"

      # --- Windows zip ---

      - name: Package GUI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Version = $env:ARTIFACT_VERSION
          $GuiDir = "Expat-Junk-${Version}-${{ matrix.display_name }}"
          New-Item -ItemType Directory -Path $GuiDir
          # The render engine is pure Rust (junk-libs-platen) — the .exe is
          # self-contained, no DLL to ship alongside it.
          Copy-Item "target\${{ matrix.target }}\release\expat-junk.exe" "$GuiDir\"
          New-Item -ItemType Directory -Path "$GuiDir\Licenses"
          Copy-Item "THIRD-PARTY.md" "$GuiDir\Licenses\"
          Copy-Item "assets\fonts\*OFL.txt" "$GuiDir\Licenses\"
          Compress-Archive -Path "$GuiDir\*" -DestinationPath "${GuiDir}.zip"
          echo "GUI_ARCHIVE=${GuiDir}.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload GUI artifact
        uses: actions/upload-artifact@v7
        with:
          name: gui-${{ matrix.display_name }}
          path: ${{ env.GUI_ARCHIVE }}

  release:
    name: Create Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
