[package]
name = "expat-junk"
version = "0.1.0"
edition = "2024"

[dependencies]
ab_glyph = "0.2.32"
anyhow = "1.0.102"
base64 = "0.22.1"
directories = "6.0.0"
eframe = "0.34.3"
egui = "0.34.3"
image = "0.25.10"
# PDFium render core (page rasterization + text-layer extraction) and its
# binary vendoring live in the shared crate. See its CLAUDE.md note on version
# pinning. Sibling-repo path dependency for local development.
junk-libs-pdfium = { path = "../junk-libs/junk-libs-pdfium" }
keyring = "4.0.1"
leptess = { version = "0.14.0", optional = true }
lopdf = "0.41.0"
# `images` enables embedding rasters (from_dynamic_image takes raw RGBA, so no
# format-decode feature is needed); drop the heavy default `html` stack.
printpdf = { version = "0.9.1", default-features = false, features = ["images"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
rfd = "0.17.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
thiserror = "2.0.18"

[features]
# OCR for the text-API path (Google/DeepL/Kagi). Off by default because leptess
# links the system Tesseract + Leptonica C libraries at build time.
ocr = ["dep:leptess"]
